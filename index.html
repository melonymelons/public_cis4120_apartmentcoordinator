<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2e2d2" />
    <meta name="description" content="Coordinate apartment tasks, shared supplies, and roommate availability." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Nest — Apartment Coordinator</title>
    <style>
      body{margin:0;background:#f2e2d2}
      .nest-loading{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;margin:0;background:#e3e8d7}
      .nest-loading-content{position:relative}
      .nest-loading-label{position:absolute;left:50%;bottom:calc(100% + 18px);transform:translateX(-50%);image-rendering:pixelated}
      .nest-loading-track{box-sizing:border-box;width:min(56vw,220px);height:20px;padding:3px;overflow:hidden;border:2px solid #7c8d68;border-radius:0;background:#cbd3bd;box-shadow:3px 3px 0 #a6b297}
      .nest-loading-fill{display:block;width:100%;height:100%;background-color:#dca1b0;background-image:repeating-linear-gradient(90deg,transparent 0 10px,#bd8496 10px 12px);box-shadow:inset 0 2px #edc0ca;clip-path:inset(0 96% 0 0)}
      .nest-loading.is-complete .nest-loading-fill{clip-path:inset(0);transition:clip-path .16s steps(2,end)}
      @media(prefers-reduced-motion:reduce){.nest-loading.is-complete .nest-loading-fill{transition:none}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
